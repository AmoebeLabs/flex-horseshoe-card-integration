name: Package FHS integration

on:
  workflow_dispatch:
    inputs:
      version:
        description: FHS tag, bijvoorbeeld v5.4.7-dev.26
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout integration wrapper
        uses: actions/checkout@v5
        with:
          path: integration

      - name: Checkout FHS
        uses: actions/checkout@v5
        with:
          repository: AmoebeLabs/flex-horseshoe-card
          ref: ${{ inputs.version }}
          path: fhs

      - name: Determine package version
        shell: bash
        run: |
          FHS_VERSION=$(jq -r '.version' fhs/package.json)
          INTEGRATION_VERSION=$(jq -r '.version' integration/custom_components/flex_horseshoe_card/manifest.json)

          PACKAGE_VERSION="${FHS_VERSION}.--iv.${INTEGRATION_VERSION}"

          echo "FHS version:         ${FHS_VERSION}"
          echo "Integration version: ${INTEGRATION_VERSION}"
          echo "Package version:     ${PACKAGE_VERSION}"

          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "$GITHUB_ENV"

      - name: Create package
        shell: bash
        run: |
          mkdir package

          # Integration wrapper.
          cp -R integration/custom_components/flex_horseshoe_card/. package/

          # FHS frontend.
          mkdir -p package/frontend
          cp fhs/dist/flex-horseshoe-card.js package/frontend/

          # FHS demo dashboard sources.
          mkdir -p package/demo
          cp -R fhs/demo/. package/demo/

          # The source manifest keeps the real integration version.
          # Only the packaged manifest gets the combined release version.
          jq \
            --arg version "${PACKAGE_VERSION}" \
            '.version = $version' \
            package/manifest.json \
            > package/manifest.tmp.json

          mv package/manifest.tmp.json package/manifest.json

          cd package
          zip -r ../flex-horseshoe-card.zip .

      - name: Create integration release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${PACKAGE_VERSION}" \
            flex-horseshoe-card.zip \
            --repo AmoebeLabs/flex-horseshoe-card-integration \
            --title "v${PACKAGE_VERSION}"
