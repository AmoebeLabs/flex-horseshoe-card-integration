name: Package FHS integration

on:
  workflow_dispatch:
    inputs:
      version:
        description: FHS tag, for example v5.4.7-dev.26
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout integration
        uses: actions/checkout@v5
        with:
          path: integration

      - name: Checkout FHS
        uses: actions/checkout@v5
        with:
          repository: AmoebeLabs/flex-horseshoe-card
          ref: ${{ inputs.version }}
          path: fhs

      - name: Determine package version
        shell: bash
        run: |
          FHS_VERSION=$(jq -r '.version' fhs/package.json)

          INTEGRATION_VERSION=$(jq -r \
            '.version' \
            integration/custom_components/flex_horseshoe_card/manifest.json)

          PACKAGE_VERSION="${FHS_VERSION}.--iv.${INTEGRATION_VERSION}"

          echo "FHS version:         ${FHS_VERSION}"
          echo "Integration version: ${INTEGRATION_VERSION}"
          echo "Package version:     ${PACKAGE_VERSION}"

          echo "FHS_VERSION=${FHS_VERSION}" >> "$GITHUB_ENV"
          echo "INTEGRATION_VERSION=${INTEGRATION_VERSION}" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "$GITHUB_ENV"

      - name: Create package
        shell: bash
        run: |
          rm -rf package
          mkdir -p package

          # Copy the complete integration.
          #
          # This already includes:
          #   demo/
          #   frontend/
          #   system/
          #   translations/
          #   __init__.py
          #   config_flow.py
          #   const.py
          #   demo.py
          #   manifest.json
          cp -R \
            integration/custom_components/flex_horseshoe_card/. \
            package/

          # Add the actual FHS JavaScript from the selected FHS release.
          mkdir -p package/frontend

          cp \
            fhs/dist/flex-horseshoe-card.js \
            package/frontend/flex-horseshoe-card.js


          # Temporarily give the integration version its own custom element
          # so it can run alongside the normal HACS dashboard version.
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("package/frontend/flex-horseshoe-card.js")
          text = path.read_text()

          text, get_count = re.subn(
              r"""customElements\.get\((['"])flex-horseshoe-card\1\)""",
              lambda m: f"customElements.get({m.group(1)}flex-horseshoe-card-i{m.group(1)})",
              text,
          )

          text, define_count = re.subn(
              r"""customElements\.define\((['"])flex-horseshoe-card\1,""",
              lambda m: f"customElements.define({m.group(1)}flex-horseshoe-card-i{m.group(1)},",
              text,
          )

          if get_count == 0:
              raise RuntimeError("customElements.get('flex-horseshoe-card') not found")

          if define_count == 0:
              raise RuntimeError("customElements.define('flex-horseshoe-card', ...) not found")

          print(f"Changed {get_count} customElements.get registration(s)")
          print(f"Changed {define_count} customElements.define registration(s)")

          path.write_text(text)
          PY
          
          # Change only the manifest inside the release package.
          # The source manifest keeps the independent integration version.
          jq \
            --arg version "${PACKAGE_VERSION}" \
            '.version = $version' \
            package/manifest.json \
            > package/manifest.tmp.json

          mv \
            package/manifest.tmp.json \
            package/manifest.json

          echo
          echo "Package contents:"
          find package -type f | sort

          echo
          echo "Packaged manifest version:"
          jq -r '.version' package/manifest.json

          cd package
          zip -r ../flex-horseshoe-card.zip .

      - name: Create integration release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${PACKAGE_VERSION}" \
            flex-horseshoe-card.zip \
            --repo AmoebeLabs/flex-horseshoe-card-integration \
            --title "v${PACKAGE_VERSION}"
