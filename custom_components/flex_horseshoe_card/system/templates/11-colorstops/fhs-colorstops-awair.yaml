fhs_colorstops_awair_score:
  template:
    type: color_stops
  color_stops:
    colors:
      - value: 0
        color: '#7e39d6'
        rank: 4
      - value: 19.5
        color: '#e9343d'
        rank: 3
      - value: 39.5
        color: '#f98602'
        rank: 2
      - value: 59.5
        color: '#fed125'
        rank: 1
      - value: 79.5
        color: '#49ce4b'
        rank: 0


